<text x="70" y="292" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#47536B">A field guide for architects: how to design modern AI</text><text x="70" y="322" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#47536B">systems, from a single model call up to fully</text><text x="70" y="352" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#47536B">orchestrated, multi-agent platforms.</text><line x1="70" y1="398" x2="530" y2="398" stroke="#C7D3E8" stroke-width="1.5"/><text x="70" y="432" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#47536B">Fifty named patterns across seven layers, meant to</text><text x="70" y="456" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#47536B">be composed rather than picked one at a time.</text><line x1="1305.0" y1="300.0" x2="1305.0" y2="105.6" stroke="#C7D3E8" stroke-width="1.6"/><line x1="1305.0" y1="300.0" x2="1525.6" y2="178.8" stroke="#C7D3E8" stroke-width="1.6"/><line x1="1305.0" y1="300.0" x2="1580.1" y2="343.3" stroke="#C7D3E8" stroke-width="1.6"/><line x1="1305.0" y1="300.0" x2="1427.4" y2="475.1" stroke="#C7D3E8" stroke-width="1.6"/><line x1="1305.0" y1="300.0" x2="1182.6" y2="475.1" stroke="#C7D3E8" stroke-width="1.6"/><line x1="1305.0" y1="300.0" x2="1029.9" y2="343.3" stroke="#C7D3E8" stroke-width="1.6"/><line x1="1305.0" y1="300.0" x2="1084.4" y2="178.8" stroke="#C7D3E8" stroke-width="1.6"/>
